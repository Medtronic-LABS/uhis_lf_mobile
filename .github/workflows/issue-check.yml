name: Issue check

on:
  issues:
    types: [opened, edited, labeled, unlabeled]

permissions:
  issues: write
  contents: read

concurrency:
  group: issue-check-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  issue-check:
    # Skip events caused by bots (including this workflow's own label changes).
    if: ${{ github.actor != 'github-actions[bot]' && !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      NEEDS_INFO_LABEL: status:needs-info
      COMMENT_MARKER: '<!-- lw-issue-check -->'
    steps:
      - uses: actions/checkout@v7

      - name: Validate issue against the intake contract
        run: |
          # The issue body is read from the event file only; it is never echoed to the log.
          python3 scripts/sdlc/check_issue.py --event "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/result.json"
          python3 - <<'PY'
          import json, os, pathlib
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          result = json.loads((temp / "result.json").read_text(encoding="utf-8"))
          (temp / "comment.md").write_text(result["comment"], encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("CHECK_OK=" + ("true" if result["ok"] else "false") + "\n")
          PY

      - name: Upsert the single bot comment
        run: |
          api="repos/$GITHUB_REPOSITORY/issues"
          existing=$(gh api --paginate "$api/$ISSUE_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | startswith(\"$COMMENT_MARKER\")) | .id" \
            | head -n 1)
          if [ "$CHECK_OK" = "true" ]; then
            if [ -n "$existing" ]; then
              gh api -X DELETE "$api/comments/$existing"
              echo "Issue is complete; removed the needs-info comment."
            fi
          elif [ -n "$existing" ]; then
            gh api -X PATCH "$api/comments/$existing" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
            echo "Updated the existing needs-info comment."
          else
            gh api -X POST "$api/$ISSUE_NUMBER/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
            echo "Created the needs-info comment."
          fi

      - name: Sync the needs-info label
        run: |
          api="repos/$GITHUB_REPOSITORY"
          if [ "$CHECK_OK" = "true" ]; then
            # 404 just means the label was not on the issue.
            gh api -X DELETE "$api/issues/$ISSUE_NUMBER/labels/${NEEDS_INFO_LABEL//:/%3A}" > /dev/null 2>&1 \
              && echo "Removed $NEEDS_INFO_LABEL." || echo "$NEEDS_INFO_LABEL was not set."
          else
            gh label create "$NEEDS_INFO_LABEL" --color FEF2C0 \
              --description "Waiting for the reporter to complete the ticket" --force \
              || echo "Could not create label; assuming it already exists."
            gh api -X POST "$api/issues/$ISSUE_NUMBER/labels" -f "labels[]=$NEEDS_INFO_LABEL" > /dev/null
            echo "Added $NEEDS_INFO_LABEL."
          fi
