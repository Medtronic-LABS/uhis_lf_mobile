name: Android APK

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Create CI env file
        env:
          API_BASE_URL: ${{ vars.APK_API_BASE_URL }}
          PASSWORD_HASH_KEY: ${{ secrets.APK_PASSWORD_HASH_KEY }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Missing repository variable APK_API_BASE_URL" >&2
            exit 1
          fi
          if [ -z "$PASSWORD_HASH_KEY" ]; then
            echo "Missing repository secret APK_PASSWORD_HASH_KEY" >&2
            exit 1
          fi
          jq -n \
            --arg apiBaseUrl "$API_BASE_URL" \
            --arg passwordHashKey "$PASSWORD_HASH_KEY" \
            '{
              API_BASE_URL: $apiBaseUrl,
              API_CLIENT: "uhis_mobile",
              PASSWORD_HASH_KEY: $passwordHashKey,
              AUTH_COOKIE_TTL_SECONDS: "3600",
              BIOMETRIC_REASON: "Unlock UHIS Next",
              DEV_USER: "",
              DEV_PASS: ""
            }' > env.ci.json

      - name: Build release APK
        run: scripts/build_apk.sh ci --release

      - name: Flutter analyze
        continue-on-error: true
        run: flutter analyze

      - name: Flutter tests
        continue-on-error: true
        run: flutter test --coverage

      - name: Sonar analysis
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && env.SONAR_ORGANIZATION != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}

      - uses: actions/upload-artifact@v7
        with:
          name: uhis-next-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
