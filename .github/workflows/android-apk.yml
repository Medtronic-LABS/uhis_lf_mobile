name: Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Create CI env file
        env:
          API_BASE_URL: ${{ vars.APK_API_BASE_URL }}
          PASSWORD_HASH_KEY: ${{ secrets.APK_PASSWORD_HASH_KEY }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Missing repository variable APK_API_BASE_URL" >&2
            exit 1
          fi
          if [ -z "$PASSWORD_HASH_KEY" ]; then
            echo "Missing repository secret APK_PASSWORD_HASH_KEY" >&2
            exit 1
          fi
          jq -n \
            --arg apiBaseUrl "$API_BASE_URL" \
            --arg passwordHashKey "$PASSWORD_HASH_KEY" \
            '{
              API_BASE_URL: $apiBaseUrl,
              API_CLIENT: "uhis_mobile",
              PASSWORD_HASH_KEY: $passwordHashKey,
              AUTH_COOKIE_TTL_SECONDS: "3600",
              BIOMETRIC_REASON: "Unlock UHIS Next",
              DEV_USER: "",
              DEV_PASS: ""
            }' > env.ci.json

      - name: Build release APK
        run: scripts/build_apk.sh ci --release

      - uses: actions/upload-artifact@v7
        with:
          name: uhis-next-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
