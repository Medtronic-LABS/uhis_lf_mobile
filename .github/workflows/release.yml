name: Release Build

# Builds and signs both Play Store apps (the `prod` and `training` Gradle
# flavors) and, on a `v*` tag push, uploads each to its own Play listing on the
# Internal testing track. Promotion to Production stays a manual step in Play
# Console.
#
# Each upload runs in a GitHub Environment (`production`, `training`) and reads
# PLAY_SERVICE_ACCOUNT_JSON from that environment's secrets. Both environments
# MUST exist before this workflow runs on a tag: GitHub auto-creates a missing
# environment with no secrets and no protection rules. Required reviewers on an
# environment are what make its upload wait for approval.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'X.Y.Z+N, or patch/minor/major, or blank to use pubspec.yaml as-is (build only, never published)'
        required: false

jobs:
  build:
    name: Build ${{ matrix.app_flavor }}
    runs-on: ubuntu-latest
    strategy:
      # One app's failure must not cancel the other app's build.
      fail-fast: false
      matrix:
        include:
          - app_flavor: prod
            env_name: production
            env_secret: ENV_PRODUCTION_JSON_BASE64
          - app_flavor: training
            env_name: training
            env_secret: ENV_TRAINING_JSON_BASE64

    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PUBSPEC_VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          if [[ "v${PUBSPEC_VERSION}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec.yaml version ${PUBSPEC_VERSION}. Merge the version bump to main before tagging."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable

      - name: Reconstruct signing keystore
        run: |
          mkdir -p android/app/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/upload.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=${{ github.workspace }}/android/app/keystore/upload.jks
          EOF

      - name: Reconstruct env.${{ matrix.env_name }}.json
        env:
          ENV_JSON_BASE64: ${{ secrets[matrix.env_secret] }}
        run: |
          if [[ -z "${ENV_JSON_BASE64}" ]]; then
            echo "::error::Repo secret ${{ matrix.env_secret }} is not set."
            exit 1
          fi
          echo "${ENV_JSON_BASE64}" | base64 -d > "env.${{ matrix.env_name }}.json"

      - name: Build and verify signer
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          chmod +x scripts/release.sh
          scripts/release.sh "${{ matrix.env_name }}" "${VERSION_INPUT}" --app-flavor "${{ matrix.app_flavor }}"

      - uses: actions/upload-artifact@v7
        with:
          name: aab-${{ matrix.app_flavor }}
          path: build/app/outputs/bundle/${{ matrix.app_flavor }}Release/app-${{ matrix.app_flavor }}-release.aab
          if-no-files-found: error

  github-release:
    name: Attach bundles to the GitHub Release
    needs: build
    # Runs even if one app's build failed, so the other app's bundle is still attached.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: aab-*
          merge-multiple: true
          path: bundles

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: bundles/*.aab
          fail_on_unmatched_files: true

  publish-play-store:
    name: Publish ${{ matrix.app_flavor }} to Play (internal track)
    needs: build
    # Tag pushes only: a manual run can bump the version without committing it,
    # so it must never reach Play. Runs even if the other app's build failed.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_flavor: prod
            package_name: com.medtroniclabs.uhis_next
            environment: production
          - app_flavor: training
            package_name: com.medtroniclabs.uhis_next.training
            environment: training
    environment: ${{ matrix.environment }}

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: store_assets/release_notes

      - name: Prepare "what's new" from the release notes
        env:
          LC_ALL: C.UTF-8
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_NAME="${VERSION%%+*}"
          NOTES_DIR="store_assets/release_notes"
          if [[ ! -f "${NOTES_DIR}/${VERSION_NAME}_en-US.txt" ]]; then
            echo "::error::${NOTES_DIR}/${VERSION_NAME}_en-US.txt is missing. Commit the release notes before tagging."
            exit 1
          fi
          mkdir -p whatsnew
          for notes in "${NOTES_DIR}/${VERSION_NAME}"_*.txt; do
            locale="${notes##*_}"
            locale="${locale%.txt}"
            chars=$(wc -m < "${notes}")
            if (( chars > 500 )); then
              echo "::error::${notes} is ${chars} characters; Play allows 500 per language."
              exit 1
            fi
            cp "${notes}" "whatsnew/whatsnew-${locale}"
          done

      - uses: actions/download-artifact@v8
        with:
          name: aab-${{ matrix.app_flavor }}
          path: bundle

      - name: Check the Play service account secret is available
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "${PLAY_SERVICE_ACCOUNT_JSON}" ]]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set in the '${{ matrix.environment }}' environment."
            exit 1
          fi

      - uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ matrix.package_name }}
          releaseFiles: bundle/app-${{ matrix.app_flavor }}-release.aab
          track: internal
          status: completed
          whatsNewDirectory: whatsnew
