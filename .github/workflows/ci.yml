name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdlc-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests for scripts/sdlc
        run: python3 -m unittest discover -s scripts/sdlc/tests -t .

  secret-scan:
    runs-on: ubuntu-latest
    env:
      # gitleaks-action needs a paid GITLEAKS_LICENSE for organisation-owned repos,
      # so the open-source CLI is run directly from a pinned, checksum-verified release.
      GITLEAKS_VERSION: 8.24.3
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks/$archive" "$base/$archive"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP/gitleaks" && grep " $archive\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/gitleaks/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks

      - name: Scan commits for secrets
        run: |
          zeros="0000000000000000000000000000000000000000"
          base="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          if [ -n "$base" ] && [ "$base" != "$zeros" ]; then
            range="$base..$GITHUB_SHA"
            echo "Scanning commit range $range"
            "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --log-opts="$range"
          else
            echo "No base commit (manual run or new branch); scanning full history"
            "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner
          fi

  flutter:
    runs-on: ubuntu-latest
    env:
      # Ratchet budgets: lower these as defects are fixed, never raise them.
      # Baseline 2026-11-04 (main@82cbd89a): 40 analyzer errors, 38 failing tests.
      ANALYZE_ERROR_BUDGET: 40
      TEST_FAILURE_BUDGET: 38
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings > "$RUNNER_TEMP/analyze.txt" 2>&1 || true

      - name: Flutter tests
        run: flutter test --coverage --reporter expanded > "$RUNNER_TEMP/tests.txt" 2>&1 || true

      - name: Sonar analysis
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && env.SONAR_ORGANIZATION != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}

      - name: Enforce analyze and test budgets
        run: |
          status=0
          summary="$RUNNER_TEMP/budget-summary.txt"
          echo "### Flutter quality budgets" > "$summary"
          python3 scripts/sdlc/ci_budget.py --analyze "$RUNNER_TEMP/analyze.txt" --budget "$ANALYZE_ERROR_BUDGET" >> "$summary" || status=1
          python3 scripts/sdlc/ci_budget.py --tests "$RUNNER_TEMP/tests.txt" --budget "$TEST_FAILURE_BUDGET" >> "$summary" || status=1
          cat "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          exit $status
