name: Release
description: Track a release (maintainers)
title: "[Release] "
labels: ["release"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: For example 1.2.0+16
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Release checklist
      options:
        - label: CI green on develop (analyze and tests within budget)
        - label: Version bumped in pubspec.yaml
        - label: Training build verified on a device
        - label: Release notes written
        - label: Prod APK built from the tagged commit and checksum recorded
