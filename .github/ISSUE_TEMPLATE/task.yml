name: Task
description: Chore, refactor, tech debt or internal work
title: "[Task] "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Do not paste patient or member data, names, phone numbers, IDs, credentials, tokens or unscrubbed logs.
  - type: textarea
    id: what
    attributes:
      label: What
    validations:
      required: true
  - type: textarea
    id: why_now
    attributes:
      label: Why now
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk if not done
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This issue contains no patient/member data, names, phone numbers, IDs, credentials, tokens or unscrubbed logs (this repo is public)
          required: true
