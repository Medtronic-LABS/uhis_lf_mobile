name: Feature request
description: Propose a new capability or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Do not paste patient or member data, names, phone numbers, IDs, credentials, tokens or unscrubbed logs.
  - type: input
    id: user
    attributes:
      label: User
      description: Who is this for (SK, supervisor, clinician, admin)?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Given ... when ... then ...
    validations:
      required: true
  - type: dropdown
    id: programme
    attributes:
      label: Programme
      options:
        - ANC
        - PNC
        - NCD
        - IMCI/iCCM
        - TB
        - EPI
        - Nutrition
        - Family planning
        - Eye care
        - Cross-cutting
    validations:
      required: true
  - type: textarea
    id: offline
    attributes:
      label: Offline behaviour
      description: What happens with no connectivity, and how does it sync later?
    validations:
      required: true
  - type: textarea
    id: designs
    attributes:
      label: Designs
      description: Links or mockups (no real patient data).
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This issue contains no patient/member data, names, phone numbers, IDs, credentials, tokens or unscrubbed logs (this repo is public)
          required: true
